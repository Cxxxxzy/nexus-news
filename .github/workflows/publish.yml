name: Update news and publish

on:
  push:
    branches: [main]
  schedule:
    # 06:17 JST (UTC 21:17 previous day); exact start is not guaranteed.
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nexus-news-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install optional AI SDK
        if: github.event_name != 'push' && vars.AI_EDITOR_ENABLED == '1'
        run: python -m pip install 'openai>=2,<4'
      - name: Fetch news on schedule or manual run
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          AI_EDITOR_ENABLED: ${{ vars.AI_EDITOR_ENABLED }}
          AI_MAX_ITEMS: '4'
        run: python scripts/update_news.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build site
        run: python scripts/build_site.py
      - name: Commit updated news data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily headlines"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only public files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
