name: Update news and publish

on:
  push:
    branches: [main]
  schedule:
    # 06:17 JST (UTC 21:17 previous day); exact start is not guaranteed.
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nexus-news-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch news on schedule or manual run
        if: github.event_name != 'push'
        run: python scripts/update_news.py
      # The AI step is optional, uses only the Cloudflare Workers Free model,
      # and never prevents regular headline updates when its quota runs out.
      - name: Optional free AI reading guides
        if: github.event_name != 'push' && vars.FREE_AI_ENABLED == '1'
        env:
          FREE_AI_ENABLED: ${{ vars.FREE_AI_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_MAX_ITEMS: '2'
        run: python scripts/free_ai_editor.py
      - name: Audit news quality (no API cost)
        run: python scripts/audit_news.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build site
        run: python scripts/build_site.py
      - name: Commit updated news data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json reports/latest-audit.md reports/ai-budget.json reports/improvement-proposals.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily headlines"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only public files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
